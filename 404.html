<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brightmo Furniture</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // Redirects 404s back to the SPA with the path encoded in the query string
    var segmentCount = 1; // number of path segments in the repo name (brightmo-web = 1)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
